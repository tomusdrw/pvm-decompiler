name: Release Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-edit
      run: cargo install cargo-edit

    - name: Bump version
      id: bump
      run: |
        cargo set-version --bump ${{ inputs.bump }}
        VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Create pull request
      uses: peter-evans/create-pull-request@v7
      with:
        branch: release/v${{ steps.bump.outputs.version }}
        commit-message: "Release v${{ steps.bump.outputs.version }}"
        title: "Release v${{ steps.bump.outputs.version }}"
        body: |
          Bumps version to `${{ steps.bump.outputs.version }}` (${{ inputs.bump }}).

          Once merged, a draft GitHub release will be created automatically.
        labels: release

    - name: Create draft GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.bump.outputs.version }}" \
          --draft \
          --title "v${{ steps.bump.outputs.version }}" \
          --generate-notes
