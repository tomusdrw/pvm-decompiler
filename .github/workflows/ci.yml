name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy -- -D warnings

    - name: Run Tests
      run: cargo test

    - name: Regenerate Example Outputs
      run: ./run_examples.sh

    - name: Enforce Output Quality Thresholds
      run: ./scripts/check_output_quality.sh

  wasm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Check WASM compilation
      run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm

    - name: Clippy (WASM)
      run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features wasm -- -D warnings

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Build WASM package
      run: wasm-pack build --target bundler --no-default-features --features wasm

    - name: Verify package contents
      run: |
        test -f pkg/pvm_decompiler_bg.wasm
        test -f pkg/pvm_decompiler.js
        test -f pkg/pvm_decompiler.d.ts
        test -f pkg/package.json
        echo "All expected package files present"
